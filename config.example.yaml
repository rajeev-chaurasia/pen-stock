# Penstock gateway configuration example.
# Copy to config.yaml and adjust for your environment.

server:
  # Loopback by default. Binding a wider address without auth.client_keys
  # below is rejected at load time, because any caller who reaches this
  # port spends the provider keys configured further down.
  listen: "127.0.0.1:8080"
  # Metrics listener. Token spend and latency profiles are operator data,
  # so this stays off the address callers use.
  admin_listen: "127.0.0.1:9090"
  # Concurrent requests allowed before the gateway sheds load with a 503.
  max_inflight: 256
  # All timeouts are in milliseconds.
  read_timeout_ms: 30000
  upstream_timeout_ms: 120000
  # How long a streaming response may sit idle before the gateway gives up.
  stream_idle_timeout_ms: 60000

auth:
  # Keys callers must present as "Authorization: Bearer <key>". Leave the
  # list empty only while listening on loopback. Generate real ones with
  # something like: openssl rand -hex 32
  #
  # Keys listed here are anonymous: they open the gateway, but spend is
  # not attributed to anyone and no limit applies.
  client_keys: []

  # Tenants give keys an identity and limits of their own. A tenant key
  # authenticates exactly like a client key above, so a deployment using
  # tenants alone may still bind a public address.
  #
  # name becomes a metrics label, so it is restricted to letters, digits,
  # underscore and hyphen. A key belongs to exactly one tenant: repeating
  # it under another tenant, or in client_keys, is rejected at load time
  # because the caller's identity would be ambiguous.
  #
  # Every limit is optional and 0 means unlimited. fail_closed decides
  # what happens when the accounting store cannot answer: true denies the
  # request, which is what a hard cap on real money needs, while false
  # allows it and leaves an alert behind.
  #
  # Keys support ${ENV_VAR} references just like provider api_key, and an
  # unset variable fails the load, which is why this block stays
  # commented out: the file has to load in a bare shell.
  #
  # tenants:
  #   - name: demo
  #     keys: ["${PENSTOCK_DEMO_KEY}"]
  #     requests_per_minute: 60
  #     tokens_per_minute: 100000
  #     daily_usd: 1.00
  #     monthly_usd: 10.00
  #     fail_closed: true

accounting:
  # Where settled requests are appended, one JSON object per line, each
  # carrying the tenant, model, tokens, cost and the price list version
  # that produced it. Leave empty to turn the ledger off, in which case
  # limits are still enforced but a restart forgets which requests the
  # running totals came from.
  #
  # The gateway refuses to start if this path cannot be opened, because
  # a ledger that silently cannot write looks exactly like one with
  # nothing to record.
  ledger_path: ""

providers:
  # Groq's OpenAI-compatible API. api_key supports ${ENV_VAR} references,
  # resolved at load time, so real keys never live in this file.
  - name: groq
    kind: groq
    base_url: https://api.groq.com/openai/v1
    api_key: ${GROQ_API_KEY}
    models:
      - llama-3.3-70b-versatile

  # Local llmsim instance for development and load testing. kind
  # openai_compat is the one kind with no built-in endpoint: llmsim,
  # vLLM and friends live wherever you put them, so base_url is required.
  - name: llmsim
    kind: openai_compat
    base_url: http://127.0.0.1:8089/v1
    api_key: sim
    models:
      - llmsim-small

  # The remaining OpenAI-wire kinds are ready to use; they are commented
  # out only because an ${ENV_VAR} that is unset fails the load, and this
  # file has to load in a bare shell. Export the key, uncomment the
  # provider and its route, and it works.
  #
  # Each base_url below repeats the default the adapter already knows for
  # that kind, since config validation asks for the field either way.
  # Change it to reach a proxy or a regional endpoint.
  #
  # Streaming requests to openai, groq, cerebras and openrouter are
  # opted into upstream token usage automatically, because per-tenant
  # budgets cannot bill what the upstream never reports. Mistral has no
  # such option and is left alone.

  # - name: openai
  #   kind: openai
  #   base_url: https://api.openai.com/v1
  #   api_key: ${OPENAI_API_KEY}
  #   models:
  #     - gpt-4o-mini

  # - name: cerebras
  #   kind: cerebras
  #   base_url: https://api.cerebras.ai/v1
  #   api_key: ${CEREBRAS_API_KEY}
  #   models:
  #     - llama3.1-8b

  # - name: mistral
  #   kind: mistral
  #   base_url: https://api.mistral.ai/v1
  #   api_key: ${MISTRAL_API_KEY}
  #   models:
  #     - mistral-small-latest

  # OpenRouter also receives HTTP-Referer and X-Title attribution
  # headers, which the adapter sends on every call.
  # - name: openrouter
  #   kind: openrouter
  #   base_url: https://openrouter.ai/api/v1
  #   api_key: ${OPENROUTER_API_KEY}
  #   models:
  #     - anthropic/claude-3.5-haiku

  # gemini and anthropic do not speak the OpenAI wire and land with their
  # own adapters separately. Leave these off until those adapters ship:
  # a kind with no adapter registered fails at startup, not at load.
  # - name: gemini
  #   kind: gemini
  #   base_url: https://generativelanguage.googleapis.com/v1beta
  #   api_key: ${GEMINI_API_KEY}
  #   models:
  #     - gemini-2.0-flash
  # - name: anthropic
  #   kind: anthropic
  #   base_url: https://api.anthropic.com/v1
  #   api_key: ${ANTHROPIC_API_KEY}
  #   models:
  #     - claude-3-5-haiku-latest

# Incoming model name -> the provider or chain that serves it.
# Models must be unique across routes; providers must be declared above,
# and each model must appear in that provider's models list.
#
# A route can name one provider, or a chain that is tried in turn. In a
# chain, a rejected payload or a client cancel stops immediately, while
# a rate limit or a dead account moves straight to the next provider and
# a transient upstream error retries in place first.
#
# strategy: priority (configured order, the default), least_latency
# (fastest healthy provider first), or round_robin (spread load, which
# across independent free tiers means spreading the quota).
#
# provider_models renames the model per provider, because a chain over
# different vendors rarely shares a vocabulary. Uncomment the block
# below once those providers and their keys are configured.
#
# - model: auto
#   providers: [groq, cerebras, openrouter]
#   strategy: round_robin
#   provider_models:
#     groq: llama-3.3-70b-versatile
#     cerebras: gpt-oss-120b
#     openrouter: "inclusionai/ling-3.0-flash:free"
routes:
  - model: llama-3.3-70b-versatile
    provider: groq
  - model: llmsim-small
    provider: llmsim
  # - model: gpt-4o-mini
  #   provider: openai
  # - model: llama3.1-8b
  #   provider: cerebras
  # - model: mistral-small-latest
  #   provider: mistral
  # - model: anthropic/claude-3.5-haiku
  #   provider: openrouter

telemetry:
  service_name: penstock
  # Leave empty to disable OTLP trace export.
  otlp_endpoint: ""
  # One of: debug, info, warn, error.
  log_level: info
