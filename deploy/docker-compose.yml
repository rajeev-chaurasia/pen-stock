# Local development stack. Paths are relative to this file, so run either
#   docker compose -f deploy/docker-compose.yml up
# from the repo root, or docker compose up from inside deploy/.

services:
  penstock:
    build:
      context: ..
    image: penstock:local
    command: ["--config", "/etc/penstock/penstock.yaml"]
    ports:
      - "8080:8080"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - ./penstock.yaml:/etc/penstock/penstock.yaml:ro
    depends_on:
      - llmsim

  llmsim:
    build:
      context: ..
    image: penstock:local
    entrypoint: ["/llmsim"]
    command: ["--seed", "42"]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - "3000:3000"
    environment:
      # Anonymous admin is for this local stack only, never production.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - jaeger
