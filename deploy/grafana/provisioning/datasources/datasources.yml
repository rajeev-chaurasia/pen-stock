apiVersion: 1

# The uid fields are pinned rather than generated. Provisioned dashboards
# reference their datasource by uid, and a uid Grafana invents at first boot
# differs between machines, which would leave every panel on a fresh stack
# pointing at nothing.

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
