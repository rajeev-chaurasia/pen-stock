  cerebras/qwen-3-32b: # unverified
    input_per_mtok: 0.40
    output_per_mtok: 0.80

  # Mistral La Plateforme. Source: mistral.ai/pricing/api
  #
  # That page prices by display name ("Mistral Small 4") while the API
  # takes a "-latest" alias, and no published page joins the two. The
  # join was made against Mistral's own GET /v1/models on 2026-08-09,
  # which reports each alias's target and that target's display name:
  #
  #   mistral-small-latest  -> mistral-small-2603  "Mistral Small 4"
  #   ministral-8b-latest   -> ministral-8b-2512   "Ministral 3 8B"
  #   ministral-3b-latest   -> ministral-3b-2512   "Ministral 3 3B"
  #   codestral-latest      -> codestral-2508      Codestral
  #
  # Three of those were being billed under the published rate, by 1.5x
  # to 2.5x. An alias moves when Mistral moves it, so these need
  # rechecking whenever they do.
  mistral/mistral-large-latest: # unverified
    # Resolves to mistral-large-2512, whose API description carries no
    # display name, so it cannot be joined to a priced row. Mistral's own
    # site also disagrees with itself: mistral.ai/pricing says Large is
    # 2.00/6.00 in prose while mistral.ai/pricing/api tables Mistral
    # Large 3 at 0.50/1.50. Left at the higher figure, which over-bills
    # rather than under-bills if it is the stale one.
    input_per_mtok: 2.00
    output_per_mtok: 6.00
  mistral/mistral-small-latest: # confirmed 2026-08-09, was 0.10/0.30
    input_per_mtok: 0.15
    output_per_mtok: 0.60
  mistral/ministral-8b-latest: # confirmed 2026-08-09, was 0.10/0.10
    input_per_mtok: 0.15
    output_per_mtok: 0.15
  mistral/ministral-3b-latest: # confirmed 2026-08-09, was 0.04/0.04
    input_per_mtok: 0.10
    output_per_mtok: 0.10
  mistral/codestral-latest: # confirmed 2026-08-09
    input_per_mtok: 0.30
    output_per_mtok: 0.90
  mistral/open-mistral-nemo: # confirmed 2026-08-09
    input_per_mtok: 0.15
    output_per_mtok: 0.15

  # OpenRouter. Prices track the upstream model and OpenRouter adds its
  # own margin on top, so every figure here is a lower bound at best.
  # Source: the openrouter.ai/api/v1/models/<id>/endpoints documents,
  # which quote USD per token; the rates below are those figures times
  # 1e6. The top-level rate is the default endpoint, and individual
  # upstream endpoints can charge more.
  openrouter/openai/gpt-4o-mini: # confirmed 2026-08-09
    input_per_mtok: 0.15
    output_per_mtok: 0.60
  openrouter/anthropic/claude-sonnet-4-5: # confirmed 2026-08-09
    input_per_mtok: 3.00
    output_per_mtok: 15.00
  openrouter/deepseek/deepseek-chat-v3-0324: # confirmed 2026-08-09
    input_per_mtok: 0.24
    output_per_mtok: 0.90
  # The :free variants cost nothing and are rate limited instead, but the
  # gateway still counts their tokens.
  "openrouter/deepseek/deepseek-r1:free":
    free: true
  "openrouter/meta-llama/llama-3.3-70b-instruct:free":
    free: true

  # The bundled load-test simulator runs locally and bills nobody, but its
  # traffic still has to show up in the ledger.
  openai_compat/llmsim-small:
    free: true
