  anthropic/claude-sonnet-4-5:
    input_per_mtok: 3.00
    output_per_mtok: 15.00
  anthropic/claude-haiku-4-5: # confirmed 2026-08-09
    input_per_mtok: 1.00
    output_per_mtok: 5.00
  anthropic/claude-opus-4-1: # confirmed 2026-08-09
    input_per_mtok: 15.00
    output_per_mtok: 75.00
  anthropic/claude-3-5-haiku-20241022:
    input_per_mtok: 0.80
    output_per_mtok: 4.00
  anthropic/claude-3-haiku-20240307: # unverified
    # Carried no mark until 2026-08-09, when a check found it is no
    # longer on Anthropic's price page in any form. An unmarked entry
    # nobody can source is worse than a marked one, because the mark is
    # the only thing telling a reader not to trust the figure.
    input_per_mtok: 0.25
