  # short-context tier (prompts up to 200k tokens). Text input rates are
  # used where the page prices audio input separately, and the 2.5 output
  # rates include thinking tokens. Gemini 2.0 Flash is marked shut down as
  # of 2026-06-01 but is still priced on the page.
  gemini/gemini-2.5-pro: # confirmed 2026-08-09
