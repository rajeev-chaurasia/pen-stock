    output_per_mtok: 2.50
  gemini/gemini-2.5-flash-lite: # confirmed 2026-08-09
    input_per_mtok: 0.10
    output_per_mtok: 0.40
  gemini/gemini-2.0-flash: # confirmed 2026-08-09
    input_per_mtok: 0.10
    output_per_mtok: 0.40

  # Groq. Source: console.groq.com/docs/models.md and the per-model pages
