# Penstock price table.
#
# Every figure is a published list price in USD per million tokens, before
# any negotiated discount, batch tier, or cached-input rate. This file is
# the single source of truth for cost math: every USD number on a
# dashboard traces back to an entry here through the price version stamped
# on its ledger row.
#
# Keys are "<provider kind>/<model>". The kind is everything before the
# first slash and matches a provider kind in the gateway config; the model
# is everything after it, so aggregator ids that themselves contain
# slashes ("openai/gpt-oss-120b" on Groq) work unchanged.
#
# Bump `version` whenever any price changes. Ledger rows keep the version
# that priced them, so spend recorded before a price cut stays
# explainable afterwards.
#
# Models absent from this table are not priced. The gateway reports them
# as unpriced rather than guessing, so a missing entry is visible instead
# of quietly reading as free.
#
# Lines marked "# unverified" are best-effort figures that were NOT
# checked against the provider's published price page. Treat them as
# placeholders and confirm them before billing anyone. Tiered pricing
# (context-length tiers, cache reads, batch discounts) is not modelled:
# where a provider tiers by context length, the base tier is used.
#
# This file is compiled into the binary, and it is the only copy. An
# operator who wants different numbers copies it out and points
# accounting at the copy rather than editing a second source of truth.

